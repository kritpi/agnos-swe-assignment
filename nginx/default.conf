upstream api {
    server api:8080;  # compose service name + container port
    keepalive 16;
}

# Brute-force guard on login only: 5 req/s per client IP, small burst.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;  # JSON bodies only

    # Shared proxy settings, inherited by every location below.
    proxy_http_version 1.1;
    proxy_set_header Connection "";  # needed for upstream keepalive
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;  # above HIS_HOSPITAL_A_TIMEOUT, so the API's own timeout error wins
    proxy_send_timeout    30s;

    location = /api/v1/staff/login {
        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://api;
    }

    location / {
        proxy_pass http://api;
    }
}
